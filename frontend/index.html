<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tradutor NL-CPC</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <a href="https://github.com/Jonta-H/Projeto_NL-CPC" target="_blank" class="github-icon">
        <i class="fa-brands fa-github"></i>
    </a>

    <div class="main-container">
        <h1>Tradutor NL-CPC</h1>

        <div class="interaction-block">
            
            <div class="toggle-group" id="function-toggle">
                <input type="radio" id="mode-nl-cpc" name="translation-mode" value="nl-cpc" checked>
                <label for="mode-nl-cpc"><i class="fa-solid fa-comment"></i> NL ➔ CPC</label>

                <input type="radio" id="mode-cpc-nl" name="translation-mode" value="cpc-nl">
                <label for="mode-cpc-nl"><i class="fa-solid fa-brain"></i> CPC ➔ NL</label>
            </div>

            <textarea id="user-input" placeholder="Digite aqui sua frase em linguagem natural..."></textarea>
            
            <div class="generation-options-container" id="generation-options-container">
                <p class="section-label">Como gerar o exemplo?</p>
                <div class="toggle-group" id="generation-toggle">
                    <input type="radio" id="gen-auto" name="generation-mode" value="auto" checked>
                    <label for="gen-auto">Automática</label>
                    <input type="radio" id="gen-manual" name="generation-mode" value="manual">
                    <label for="gen-manual">Glossário</label>
                </div>
                <p id="description-auto" class="generation-description">
                    A IA criará um exemplo completo do zero, definindo o significado de cada átomo e montando a frase.
                </p>
                <p id="description-manual" class="generation-description">
                    Você fornecerá o significado de cada variável (p, q, r, etc.).
                </p>
                <textarea id="glossary-input" placeholder="P: O dia esta ensolarado, Q: O tempo está bom "></textarea>
            </div>

            <button id="action-button" class="action-button">
                <i class="fa-solid fa-play"></i>
                <span id="button-text">Traduzir</span>
            </button>

            <div id="main-response-container" class="main-response-container">
                <pre id="main-response-output"></pre>
            </div>

        </div>
        
        <div id="details-area" class="details-area">
            
            <div id="loader" class="loader"></div>
            
            <div id="details-wrapper" style="display: none; width: 100%;">
            
                <button id="toggle-details-button" class="details-button">
                    <span id="details-button-text">Ver processo</span>
                    <i id="details-button-icon" class="fa-solid fa-chevron-down"></i>
                </button>
    
                <div id="details-content" class="details-content">
                    <pre id="details-output"></pre> </div>

            </div>
        </div>

    </div>

    <script src="script.js" defer></script>
</body>
</html>
